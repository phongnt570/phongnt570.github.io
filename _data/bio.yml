# Long form — used in <meta name="description">, og:description, JSON-LD
description: >-
  Tuan-Phong Nguyen (Nguyễn Tuấn Phong) is a lecturer at VNU University of
  Engineering and Technology in Hanoi, Vietnam. He researches large language
  models and knowledge bases, and holds a PhD in Computer Science from the
  Max Planck Institute for Informatics.

