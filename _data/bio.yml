about: |
  Tuan-Phong Nguyen (<span lang="vi">Nguyễn Tuấn Phong</span>) is a lecturer
  at VNU University of Engineering and Technology. His research interests
  include Large Language Models and Knowledge Bases. He holds a Ph.D. from
  the
  [Max Planck Institute for Informatics](https://www.mpi-inf.mpg.de/){:target="_blank" rel="noopener"},
  a M.Sc. from
  [Saarland University](https://saarland-informatics-campus.de/en/){:target="_blank" rel="noopener"},
  and a B.Sc. from
  [Vietnam National University Hanoi](https://uet.vnu.edu.vn/){:target="_blank" rel="noopener"}.
